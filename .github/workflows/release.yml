name: Create release

# On push to master branch. i.e. when we merge a PR.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_PATH: src/Blazor.Diagrams/bin/Release/*.nupkg

jobs:
  release:
    name: Build - Release

    # WTG private runner, so the job can reach artifactory.wtg.zone.
    runs-on: wtg-aue-linux-x64
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
            10.0.x
            8.0.x

      # Finds the latest release and increases the version
    - name: Get next version
      uses: reecetech/version-increment@2023.9.3
      id: version
      with:
        scheme: semver
        increment: patch

    - name: Configure Artifactory with OIDC
      uses: jfrog/setup-jfrog-cli@v5
      env:
        JF_URL: https://artifactory.wtg.zone
      with:
        version: latest
        oidc-provider-name: github-wisetechglobal
        oidc-audience: artifactory.wtg.zone
        disable-auto-build-publish: true

    - name: Configure NuGet repositories
      run: jf dotnet-config --repo-resolve=cargowise-nuget-virtual

      # Writes the new version number to build/Version.props
    - name: Set version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        sed -i "s|<Version></Version>|<Version>${VERSION}</Version>|" build/Version.props
        grep -q "<Version>${VERSION}</Version>" build/Version.props

    - name: Install dependencies
      run: jf dotnet restore

      # Pacakge is created on build
    - name: Build
      run: dotnet build --configuration Release --no-restore

      # Upload package as an atrifact to the GitHub action
    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: ${{ env.PACKAGE_PATH }}
        retention-days: 5

      # Publish before tagging, so a failed push doesn't use up a version number.
    - name: Push NuGet package to Artifactory
      run: jf rt upload "${{ env.PACKAGE_PATH }}" "cargowise-nuget-local/" --flat=true --fail-no-op=true

      # Create a new release and upload the package to the release
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_PATH }}
        tag_name: ${{ steps.version.outputs.version }}
